services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Knowledge Base API
      ENVIRONMENT: docker
      SERVICE_NAME: kb-pdf-backend
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173,http://[::1]:5173}"
      CORS_ORIGIN_REGEX: "${CORS_ORIGIN_REGEX:-^https?://(localhost|127(?:\\.\\d{1,3}){3}|0\\.0\\.0\\.0|\\[::1\\])(:\\d+)?$}"

      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: knowledge_base

      JWT_SECRET_KEY: change_this_secret_key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123

      USER_USERNAME: user
      USER_PASSWORD: user123

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: pdf-documents
      MINIO_SECURE: "false"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.2}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      RAG_TOP_K: 5
      RAG_CHUNK_SIZE: 800
      RAG_CHUNK_OVERLAP: 120

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: knowledge_chunks
      QDRANT_VECTOR_SIZE: 1536
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  minio_data:
  qdrant_data:
